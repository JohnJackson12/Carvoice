name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download speech model (kept out of git - some of its files are
          bigger than GitHub's per-file upload limit, so it's fetched here
          at build time instead of being committed to the repo)
        run: |
          curl -L -o model.zip https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip
          rm -rf app/src/main/assets/model
          mkdir -p app/src/main/assets/model
          unzip -q model.zip -d /tmp/model_extract
          mv /tmp/model_extract/vosk-model-small-en-us-0.15/* app/src/main/assets/model/
          touch app/src/main/assets/model/uuid  # some small models ship without one; vosk-android expects it to exist
          ls -la app/src/main/assets/model

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CarVoicePlayer-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
