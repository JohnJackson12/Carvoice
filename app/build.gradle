plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.carvoice.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.carvoice.app"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    // The Vosk model is bundled as a raw asset folder (see assets/model/) so
    // the app works fully offline with no first-run download step. Don't
    // let Android's build tools try to compress the model's binary files.
    androidResources {
        noCompress += ["mdl", "fst", "conf", "int", "ivector", "carpa", "txt"]
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.activity:activity-ktx:1.9.0'

    // Offline speech recognition (wraps Kaldi/Vosk natively for Android).
    implementation 'com.alphacephei:vosk-android:0.3.75'
    implementation 'net.java.dev.jna:jna:5.14.0@aar'
}
